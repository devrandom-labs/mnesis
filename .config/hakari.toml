# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the new feature resolver.
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = [
  "x86_64-unknown-linux-gnu"
  # "x86_64-apple-darwin",
  # "x86_64-pc-windows-msvc",
]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

# Keep optional / feature-gated deps out of the unified workspace-hack dep
# set so the "feature off → dep absent from dep tree" guarantee holds for
# every workspace member, not just published consumers. Without this,
# hakari pulls `futures-core` (used by mnesis-store's `futures-bridge`
# feature) into `workspace-hack`, which propagates into every member that
# depends on `workspace-hack` regardless of feature selection.
[final-excludes]
# `mnesis` is the no_std kernel — it must not depend on the (std) workspace-hack.
# hakari removes the edge; `hakari verify` enforces its absence. (#279)
#
# `mnesis-nostd-smoketest` is the no_std derive-macro compile-gate (#304): it is
# built for thumbv7em/wasm32, so a std workspace-hack edge would break it.
#
# `mnesis-store` is no_std (core+alloc) — workspace-hack force-enables
# std-implying futures-util features (io/channel/sink) that feature
# unification would leak into its --no-default-features build. (#301)
#
# `mnesis-wake-nostd` is the no_std WakeSource bridge (#302): built for
# thumbv7em/wasm32 by the no_std gates, so a std workspace-hack edge would
# break it — same reasoning as `mnesis-nostd-smoketest`.
#
# `mutants-gate` is a CI-only host tool (the mutation-gate verdict), never
# shipped and never a dependency of any published crate. It stays out of the
# workspace-hack unification so a build-time-only tool does not perturb the
# feature set of the real dependency graph.
workspace-members = ["mnesis", "mnesis-nostd-smoketest", "mnesis-store", "mnesis-wake-nostd", "mutants-gate"]
third-party = [
  { name = "futures-core" },
]
