name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-fail:
    name: Compile-fail tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install repository toolchain
        # rustup reads the exact version, components and targets from the file.
        run: rustup show active-toolchain

      - name: Kernel compile-fail tests
        run: cargo test -p mnesis --all-features --locked --test compile_tests

      - name: Macro compile-fail tests
        run: cargo test -p mnesis-macros --all-features --locked --test compile_fail_tests

      - name: Store compile-fail tests
        run: cargo test -p mnesis-store --all-features --locked --test compile_fail_tests

  feature-isolation:
    name: Features (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - mnesis
          - mnesis-macros
          - mnesis-store
          - mnesis-store-testing
          - mnesis-wake
          - mnesis-wake-nostd
          - mnesis-inmemory
          - mnesis-fjall
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install repository toolchain
        run: rustup show active-toolchain

      - name: Check isolated libraries and unit harnesses
        run: python3 scripts/check-features.py "${{ matrix.package }}"

  feature-isolation-gate:
    name: Feature isolation
    runs-on: ubuntu-latest
    needs: feature-isolation
    if: always()
    permissions: {}
    steps:
      - name: Require every feature matrix member
        env:
          RESULT: ${{ needs.feature-isolation.result }}
        run: test "$RESULT" = success

  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Flake Check
        # -L: stream full build logs. Without it a failing derivation surfaces as
        # Nix's truncated last-25-lines summary, which hides the real error.
        run: nix flake check -L

  postgres-integration:
    name: Postgres Integration (nixosTest)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-pg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-pg-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-pg-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Postgres nixosTest
        run: nix build .#postgres-integration -L
