name: Release

permissions:
  pull-requests: write
  contents: write

# Only wake release-plz when something that can land in a published version
# actually changed. A docs-only or CI-only push to main never starts a release
# run; the release PR that release-plz opens edits Cargo.toml (+ Cargo.lock), so
# merging it still matches `paths` and the tag/publish step fires as normal.
#
# `workflow_dispatch` is the manual escape hatch: it bypasses the `paths` filter
# so a maintainer can refresh the release PR (or cut a release) on demand.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'adapters/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  release-plz:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Mint a short-lived (~1h), repo-scoped token from a GitHub App that has
      # ONLY Contents + Pull-requests write on this repo. This keeps the org's
      # default GITHUB_TOKEN locked to read-only (no org-wide loosening) while
      # still letting release-plz open its release PR and push tags/releases.
      # Root cause of the historical 403 (#221): the default GITHUB_TOKEN cannot
      # create PRs under this repo's Actions permissions.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Create or update release PR
        id: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Keep the publishing checkout on the triggering main commit. Resolving
      # the release PR's isolated fuzz workspaces must never publish its head.
      - name: Checkout release PR for lockfile updates
        if: steps.release-pr.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
          path: release-pr
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Synchronize isolated fuzz lockfiles
        if: steps.release-pr.outputs.prs_created == 'true'
        working-directory: release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
        run: |
          cargo update --manifest-path fuzz/Cargo.toml -p mnesis -p mnesis-store
          cargo update --manifest-path fuzz-afl/Cargo.toml -p mnesis -p mnesis-store
          if git diff --quiet -- fuzz/Cargo.lock fuzz-afl/Cargo.lock; then
            exit 0
          fi
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$RELEASE_BRANCH" \
            --arg expected "$(git rev-parse HEAD)" \
            --rawfile replay fuzz/Cargo.lock \
            --rawfile afl fuzz-afl/Cargo.lock \
            '{query: "mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $expected,
                message: {headline: "chore(release): synchronize fuzz workspace locks"},
                fileChanges: {additions: [
                  {path: "fuzz/Cargo.lock", contents: ($replay | @base64)},
                  {path: "fuzz-afl/Cargo.lock", contents: ($afl | @base64)}
                ]}
              }}}' > "$RUNNER_TEMP/release-locks.json"
          # The App commit is GitHub-signed and triggers the required PR checks.
          # An updated PR head fails the expectedHeadOid check instead of overwrite.
          gh api graphql --input "$RUNNER_TEMP/release-locks.json"

      # workspace-hack must never leak into the published manifests. `cargo hakari
      # disable` strips the workspace-hack dependency edges before publish; it is
      # the workspace analogue cesr (a single crate) does not need.
      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Disable workspace-hack for publishing
        run: cargo hakari disable

      # On a release commit, cut the version + changelog, tag, make the GitHub
      # release, and publish the crates to crates.io. Use the built-in token
      # here deliberately: events created by GITHUB_TOKEN do not recursively
      # start another workflow run. The App token above is scoped only to the
      # operation for which it is required: opening/updating the release PR.
      # The registry token is the org-level CARGO_REGISTRY_SECRET. (#364)
      - name: Publish and tag releases
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_SECRET }}
