[workspace]
resolver = "2"
members = [
    "adapters/fjall",
    "adapters/inmemory",
    "adapters/postgres",
    "crates/macros",
    "crates/macros/tests/cross_crate_test",
    "crates/mnesis",
    "crates/nostd-smoketest",
    "crates/store",
    "crates/store-testing",
    "crates/test-domains",
    "crates/wake",
    "crates/wake-nostd",
    "crates/workspace-hack",
    "examples/axum-todos",
    "examples/closing-the-books",
    "examples/fjall-end-to-end",
    "examples/inmemory",
    "examples/projection-tokio",
    "examples/signed-events",
    "examples/store-and-kernel",
    "examples/store-inmemory",
    "mutants-gate",
]

[workspace.dependencies]
aligned-vec = { version = "=0.6.4", default-features = false }
arrayvec = { version = "0.7.6", default-features = false }
axum = "0.8.9"
blake3 = "1.8.5"
bytemuck = { version = "1", features = ["derive"] }
bytes = { version = "1", default-features = false }
crc32c = "0.6.8"
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", features = ["html_reports"] }
ed25519-dalek = "2.2.0"
embassy-executor = { version = "0.10.0", features = ["platform-std", "executor-thread"] }
event-listener = { version = "5.4.1", default-features = false }
fjall = { version = "3", features = ["bytes_1"] }
foldhash = "0.2.0"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-core = { version = "0.3", default-features = false }
http-body-util = "0.1.4"
hyper = "1.10.1"
hyper-util = { version = "0.1.20", features = ["client", "http1", "client-legacy"] }
insta = "1.47.2"
minicbor = { version = "2.2.2", features = ["alloc"] }
parking_lot = "0.12.5"
proptest = "1.11.0"
proptest-state-machine = "0.8.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rkyv = "0.8"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros"] }
static_assertions = "1.1.0"
tempfile = "3"
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.52.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[workspace.package]
version = "0.2.0"
edition = "2024"
# MSRV == the pinned toolchain (rust-toolchain.toml). Policy: pin tracks the
# latest stable we build/test against; bump both together. See issue #204.
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/mnesis"
homepage = "https://github.com/devrandom-labs/mnesis"

[workspace.lints.clippy]
# 1. THE FOUNDATION
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# 2. THE RUTHLESS RESTRICTIONS
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# 3. MEMORY & PERFORMANCE STRICTNESS
clone_on_ref_ptr = "deny"
as_conversions = "deny"
str_to_string = "deny"
implicit_clone = "deny"

# 4. VARIABLE HYGIENE
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# 5. THE "NO CHEATING" RULE
allow_attributes_without_reason = "deny"

[workspace.metadata.crane]
name = "mnesis"
