[package]
name = "mnesis-fjall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fjall-backed event store adapter for the Mnesis event-sourcing framework"
readme = "README.md"
keywords = ["event-sourcing", "event-store", "fjall", "embedded"]
categories = ["database"]

[features]
snapshot = ["mnesis-store/snapshot"]
projection = ["mnesis-store/projection"]
export = ["mnesis-store/export"]
import = ["mnesis-store/import"]

[dependencies]
arrayvec = { workspace = true }
bytes = { workspace = true, features = ["std"] }
fjall = { workspace = true }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
mnesis = { version = "0.2.1", path = "../../crates/mnesis" }
mnesis-store = { version = "0.2.1", path = "../../crates/store", features = ["subscription"] }
mnesis-wake = { version = "0.2.1", path = "../../crates/wake" }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
# Self dev-dependency: enables the `export`/`import` features for the crate's
# own test + bench builds so the feature-gated impls and tests below actually
# run under the default-feature `nix flake check` gate (which builds with
# default features only). Same unification trick `mnesis-store` uses for its
# testing/export/import/cbor tests. `cargo add` refuses a self-dependency, so
# this is a deliberate manual entry.
mnesis-fjall = { path = ".", features = ["export", "import", "snapshot", "projection"] }
# Pulls the CBOR backup box (`mnesis_store::cbor`) into the test build; `cbor`
# implies mnesis-store's `export`+`import`, so the end-to-end round-trip tests
# can encode/decode chunks. Separate from the line above because `cbor` is a
# mnesis-store feature, not a mnesis-fjall one.
mnesis-store = { path = "../../crates/store", features = ["cbor"] }
mnesis-store-testing = { path = "../../crates/store-testing", features = [
    "snapshot",
    "atomic-append",
] }
proptest = { workspace = true }
proptest-state-machine = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "fjall_benchmarks"
harness = false

# Storage-cost measurement for the projection-state partition (#164 follow-up).
# A deterministic reporting binary (not criterion): prints on-disk footprint
# tables for the partition-config and separate-vs-prefixed forks.
[[bench]]
name = "projection_storage"
harness = false

# Decision-gate benchmark for the `events_global` ($all index) layout fork
# (#333, rule 9): A2 (id in key, shared value) vs A1 (id in value wrap).
[[bench]]
name = "all_index_layout"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
