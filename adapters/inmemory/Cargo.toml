[package]
name = "mnesis-inmemory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-memory event-store adapter for the Mnesis event-sourcing framework"
readme = "README.md"
keywords = ["event-sourcing", "event-store", "in-memory", "testing"]
categories = ["data-structures", "development-tools::testing"]

[features]
export = ["mnesis-store/export"]
import = ["mnesis-store/import"]

[dependencies]
bytes = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
mnesis = { version = "0.1.0", path = "../../crates/mnesis" }
mnesis-store = { version = "0.1.0", path = "../../crates/store", features = ["subscription"] }
mnesis-wake = { version = "0.1.0", path = "../../crates/wake" }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
# Path-only self dev-dep (no version) unifies the `import` feature into the
# crate's own test targets — `AtomicAppend` on `InMemoryStore` is gated
# behind it (matches the pattern mnesis-store uses for mnesis-inmemory).
mnesis-inmemory = { path = ".", features = ["import"] }
mnesis-store-testing = { version = "0.1.0", path = "../../crates/store-testing", features = [
    "snapshot",
    "atomic-append",
] }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
