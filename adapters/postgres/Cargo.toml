[package]
name = "mnesis-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PostgreSQL-backed event store adapter for the Mnesis event-sourcing framework"
readme = "README.md"
keywords = ["event-sourcing", "event-store", "postgres"]
categories = ["database"]

[dependencies]
bytes = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
mnesis = { version = "0.1.0", path = "../../crates/mnesis" }
mnesis-store = { version = "0.1.0", path = "../../crates/store", features = ["subscription"] }
mnesis-wake = { version = "0.1.0", path = "../../crates/wake" }
sqlx = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
mnesis-store-testing = { version = "0.1.0", path = "../../crates/store-testing" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
