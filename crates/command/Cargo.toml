[package]
name = "mnesis-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Durable command processing over Mnesis and Tokio"
readme = "README.md"
publish = false

[features]
default = []
metrics = ["dep:metrics"]
tracing = ["dep:tracing"]

[dependencies]
bytes = { workspace = true, features = ["std"] }
metrics = { workspace = true, optional = true }
mnesis = { version = "0.5.4", path = "../mnesis", default-features = false }
mnesis-store = { version = "0.5.4", path = "../store", default-features = false }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tower-service = { workspace = true }
tracing = { workspace = true, optional = true, features = ["std"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
futures = { workspace = true, features = ["std", "async-await", "executor"] }
mnesis-fjall = { version = "0.5.4", path = "../../adapters/fjall" }
mnesis-inmemory = { version = "0.5.4", path = "../../adapters/inmemory" }
mnesis-store = { version = "0.5.4", path = "../store", default-features = false, features = ["projection"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
