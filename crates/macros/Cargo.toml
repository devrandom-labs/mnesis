[package]
name = "mnesis-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Derive macros for the Mnesis event-sourcing framework"
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "derive", "macro"]
categories = ["data-structures"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
# `full` is load-bearing: the `#[mnesis::aggregate]` / `#[mnesis::transforms]`
# attribute macros parse `ItemImpl` / `ImplItem` / `ImplItemFn`, all gated behind
# syn's `full` feature. Omitting it only compiles inside the workspace because
# feature unification (via workspace-hack) enables `full` transitively; a
# standalone publish fails without it. Caught by `cargo publish --dry-run` (#280).
syn = { version = "2.0.117", features = ["extra-traits", "parsing", "derive", "full"] }
workspace-hack = { version = "0.1.0", path = "../workspace-hack" }

[dev-dependencies]
mnesis = { path = "../mnesis", features = ["derive"] }
mnesis-store = { path = "../store" }
proptest = { workspace = true }
thiserror = { workspace = true }
trybuild = "1"

[package.metadata.docs.rs]
all-features = true
