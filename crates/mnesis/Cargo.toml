[package]
name = "mnesis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A zero-compromise event-sourcing and CQRS kernel for Rust with maximum compile-time type safety"
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "ddd", "aggregate", "domain-driven-design"]
categories = ["data-structures"]

[dependencies]
arrayvec = { workspace = true }
# Exact `=` version lock (serde/serde_derive model): a published `mnesis` requires
# the byte-identical `mnesis-macros` it was built against, so the derive output can
# never drift from the kernel it expands into. release-plz bumps both in lockstep.
# See STABILITY.md (#282).
mnesis-macros = { version = "=0.1.0", path = "../macros", optional = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Self dev-dependency enabling the test-only features, so the default-feature
# `nix flake check` nextest run compiles and exercises the `testing` fixture
# tests via Cargo feature unification (mirrors mnesis-store's pattern). Without
# this, the gate runs default features only and skips the fixture entirely.
mnesis = { version = "0.1.0", path = ".", features = ["testing", "derive"] }
mnesis-macros = { version = "0.1.0", path = "../macros" }
proptest = { workspace = true }
static_assertions = { workspace = true }
thiserror = { workspace = true }
trybuild = "1"

[features]
default = ["std"]
# Additive: enabling `std` only ADDS (the std::error::Error bridge via
# thiserror); disabling it (`--no-default-features`) yields a no_std +
# core::error::Error kernel. (#279)
std = ["thiserror/std"]
derive = ["dep:mnesis-macros"]
testing = []

[[bench]]
name = "kernel_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
