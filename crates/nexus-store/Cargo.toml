[package]
name = "nexus-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Event store edge layer for the Nexus event-sourcing framework"
readme = "../../README.md"
keywords = ["event-sourcing", "event-store", "cqrs", "persistence"]
categories = ["data-structures"]

[features]
default = ["std"]
# Additive: enabling `std` only ADDS (the std::error::Error bridge via
# thiserror + the deps' std impls); disabling it (`--no-default-features`)
# yields a no_std + alloc + core::error::Error store. (#301, mirrors #279)
std = [
    "thiserror/std",
    "nexus/std",
    "futures/std",
    "bytes/std",
    "aligned-vec/std",
]
# Generic catch-up-then-live-tail subscription loop + the `wake` traits.
# Dep-free: the loop is generic over `WakeSource`, so no runtime is pulled.
# The in-process wake registry (`StreamNotifiers`, tokio-backed) lives in the
# `nexus-wake` crate; the in-memory adapter lives in `nexus-inmemory`.
subscription = []
serde = ["dep:serde"]
json = ["serde", "dep:serde_json"]
snapshot = []
snapshot-json = ["snapshot", "json"]
projection = []
projection-json = ["projection", "json"]
# Export/import contract (issue #145). The trait/type surface only — no new
# deps. The default CBOR box (a later card) lands behind a separate `cbor`
# feature that will imply both.
export = []
import = []
bytemuck = ["dep:bytemuck"]
rkyv = ["dep:rkyv"]
# Retired feature, kept as no-op until Task 6 removes the lingering
# #[cfg(feature = "futures-bridge")] gates in stream/*. Deleting the
# feature now would emit `unexpected_cfgs` warnings that fail clippy
# `--deny warnings`. See deviations doc.
futures-bridge = []
# Default CBOR backup box (issue #145, Card 3). Implies export+import; the
# inverse never holds (Agency enables export/import and brings its own CESR box,
# pulling no CBOR).
cbor = ["import", "export", "dep:minicbor", "dep:crc32c"]

[dependencies]
aligned-vec = { workspace = true }
arrayvec = { workspace = true }
bytemuck = { workspace = true, optional = true }
bytes = { workspace = true }
crc32c = { workspace = true, optional = true }
futures = { workspace = true }
futures-core = { workspace = true }
minicbor = { workspace = true, features = ["derive"], optional = true }
nexus = { version = "0.1.0", path = "../nexus", default-features = false }
rkyv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
insta = { workspace = true }
# Self dev-dependency unifies feature-gated integration tests into the
# default-feature nextest gate (which builds no explicit features). Without
# `snapshot-json` the `snapshot`-gated test files (snapshot_tests.rs,
# snapshot_integration_tests.rs) never compiled or ran in CI — nothing in the
# default workspace graph enables `snapshot`. See issue #262.
nexus-store = { path = ".", features = ["subscription", "export", "import", "cbor", "snapshot-json", "projection"] }
# In-memory adapter for white-box tests. Path-only (no version): a dev-dep
# cycle (nexus-inmemory depends on nexus-store) is legal for cargo and the
# path-only form is stripped at publish time.
nexus-inmemory = { path = "../nexus-inmemory", features = ["export", "import"] }
nexus-store-testing = { version = "0.1.0", path = "../nexus-store-testing" }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trybuild = { version = "1", features = ["diff"] }

[[bench]]
name = "store_bench"
harness = false

[lints]
workspace = true
