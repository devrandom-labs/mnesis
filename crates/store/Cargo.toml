[package]
name = "mnesis-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Event store edge layer for the Mnesis event-sourcing framework"
readme = "README.md"
keywords = ["event-sourcing", "event-store", "cqrs", "persistence"]
categories = ["data-structures"]

[features]
default = ["std"]
# Additive: enabling `std` only ADDS (the std::error::Error bridge via
# thiserror + the deps' std impls); disabling it (`--no-default-features`)
# yields a no_std + alloc + core::error::Error store. (#301, mirrors #279)
std = [
    "thiserror/std",
    "mnesis/std",
    "futures/std",
    "bytes/std",
    "aligned-vec/std",
    "tracing?/std",
]
# Generic catch-up-then-live-tail subscription loop + the `wake` traits.
# Dep-free: the loop is generic over `WakeSource`, so no runtime is pulled.
# The in-process wake registry (`StreamNotifiers`, tokio-backed) lives in the
# `mnesis-wake` crate; the in-memory adapter lives in `mnesis-inmemory`.
subscription = []
# Inline `tracing` spans at the facade seams (issue #136). Off by default;
# no_std + alloc clean (the workspace `tracing` entry is default-features =
# false). Span/event names, fields, and levels are diagnostic output, not
# semver surface (STABILITY.md).
tracing = ["dep:tracing"]
serde = ["dep:serde"]
json = ["serde", "dep:serde_json"]
snapshot = []
snapshot-json = ["snapshot", "json"]
projection = []
projection-json = ["projection", "json"]
# Export/import contract (issue #145). The trait/type surface only — no new
# deps. The default CBOR box (a later card) lands behind a separate `cbor`
# feature that will imply both.
export = []
import = []
bytemuck = ["dep:bytemuck"]
rkyv = ["dep:rkyv"]
# Retired feature, kept as no-op until Task 6 removes the lingering
# #[cfg(feature = "futures-bridge")] gates in stream/*. Deleting the
# feature now would emit `unexpected_cfgs` warnings that fail clippy
# `--deny warnings`. See deviations doc.
futures-bridge = []
# Default CBOR backup box (issue #145, Card 3). Implies export+import; the
# inverse never holds (Agency enables export/import and brings its own CESR box,
# pulling no CBOR).
cbor = ["import", "export", "dep:minicbor", "dep:crc32c"]

[dependencies]
aligned-vec = { workspace = true }
arrayvec = { workspace = true }
bytemuck = { workspace = true, optional = true }
bytes = { workspace = true }
crc32c = { workspace = true, optional = true }
futures = { workspace = true }
futures-core = { workspace = true }
minicbor = { workspace = true, features = ["derive"], optional = true }
mnesis = { version = "0.2.0", path = "../mnesis", default-features = false }
rkyv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes"], optional = true }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
insta = { workspace = true }
# Self dev-dependency unifies feature-gated integration tests into the
# default-feature nextest gate (which builds no explicit features). Without
# `snapshot-json` the `snapshot`-gated test files (snapshot_tests.rs,
# snapshot_integration_tests.rs) never compiled or ran in CI — nothing in the
# default workspace graph enables `snapshot`. See issue #262. `bytemuck`/`rkyv`
# are here so the zero-copy codec modules (and their inline round-trip tests)
# actually compile under the mutation sweep; without them those codecs are dead
# code the mutation gate can only report as phantom survivors.
mnesis-store = { path = ".", features = [
    "subscription",
    "tracing",
    "export",
    "import",
    "cbor",
    "snapshot-json",
    "projection",
    "bytemuck",
    "rkyv",
] }
# In-memory adapter for white-box tests. Path-only (no version): a dev-dep
# cycle (mnesis-inmemory depends on mnesis-store) is legal for cargo and the
# path-only form is stripped at publish time.
mnesis-inmemory = { path = "../../adapters/inmemory", features = ["export", "import"] }
mnesis-store-testing = { path = "../store-testing" }
# Shared toy test domains (#239). `serde` on: snapshot_integration_tests round-
# trips the canonical `Counter` domain through `JsonCodec`. Path-only dev-dep
# (legal cycle via mnesis); repository_qa uses its own hand-rolled codecs.
mnesis-test-domains = { path = "../test-domains", features = ["serde"] }
parking_lot = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { workspace = true }
trybuild = { version = "1", features = ["diff"] }

[[bench]]
name = "store_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
