[package]
name = "mnesis-wake-nostd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std global-eventcount WakeSource for on-device live-tail subscriptions"
readme = "README.md"
keywords = ["event-sourcing", "subscription", "wake", "no-std", "embedded"]
categories = ["embedded", "no-std", "asynchronous", "data-structures"]

# Deliberately NO workspace-hack dependency (hakari final-excludes, see
# .config/hakari.toml): this crate is built for thumbv7em/wasm32 by the
# no_std flake gates, and a std workspace-hack edge would break them.
[dependencies]
event-listener = { workspace = true }
mnesis-store = { version = "0.2.0", path = "../store", default-features = false, features = ["subscription"] }

[lints]
workspace = true

[dev-dependencies]
embassy-executor = { workspace = true }
futures = { workspace = true, features = ["std", "executor"] }
mnesis = { path = "../mnesis" }
mnesis-inmemory = { path = "../../adapters/inmemory" }
mnesis-store = { path = "../store", features = ["std", "subscription"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[package.metadata.docs.rs]
all-features = true
