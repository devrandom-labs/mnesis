[package]
name = "mnesis-wake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "In-process subscription wake registry (StreamNotifiers) for mnesis-store adapters"
readme = "../../README.md"
keywords = ["event-sourcing", "subscription", "wake", "notify"]
categories = ["data-structures", "asynchronous"]

[dependencies]
foldhash = { workspace = true }
mnesis-store = { version = "0.1.0", path = "../store", features = ["subscription"] }
parking_lot = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
