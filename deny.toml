[advisories]
# Check for known vulnerabilities in the lockfiles (`cargo deny check advisories`).
# All advisories are blocking; every entry in `ignore` must be a dated, reasoned
# exception with a named owner for the real fix.
version = 2
ignore = [
    # 2026-09-17: `event-listener` 5.4.1 — RUSTSEC-2026-0221 (unsound: the
    # `listener!` macro's `StackSlot` lets `!Send` tags cross threads). Fixed
    # in 5.4.2; pulled in transitively (mnesis-wake-nostd, sqlx-core). Ignored
    # here ONLY because this PR is scoped to CI config and cannot touch
    # Cargo.lock. The real fix — `cargo update -p event-listener` (>= 5.4.2) —
    # should land as its own commit and delete this entry.
    "RUSTSEC-2026-0221",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause", # required by arrayref (transitive via blake3, examples/signed-events)
    "ISC",
    "Unicode-3.0",  # For Unicode data
    "MPL-2.0", # Mozilla Public License
    "Zlib",
    "BSL-1.0",
    "BlueOak-1.0.0", # Blue Oak Model License — permissive, required by crc32c
    "0BSD", # BSD Zero Clause — public-domain-equivalent, no attribution clause;
            # required by varint-rs >= 2.2.1 (transitive via lsm-tree/fjall),
            # which relicensed from Apache-2.0 in a patch release.
]
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]


[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
