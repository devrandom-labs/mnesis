[package]
name = "mnesis-example-command"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
default = []
telemetry = [
    "mnesis-command/tracing",
    "mnesis-command/metrics",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:opentelemetry",
    "dep:opentelemetry-stdout",
    "dep:opentelemetry_sdk",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
mnesis = { path = "../../crates/mnesis", default-features = false }
mnesis-command = { path = "../../crates/command", default-features = false }
mnesis-inmemory = { path = "../../adapters/inmemory" }
mnesis-store = { path = "../../crates/store", default-features = false }
opentelemetry = { workspace = true, optional = true }
opentelemetry-stdout = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["std", "async-await"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
parking_lot = { workspace = true }

[lints]
workspace = true
