[package]
name = "mnesis-example-projection-tokio"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
bytes = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
mnesis = { path = "../../crates/mnesis", features = ["derive"] }
mnesis-inmemory = { path = "../../adapters/inmemory" }
mnesis-store = { path = "../../crates/store", features = ["projection", "subscription"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
