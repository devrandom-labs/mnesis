# Shared fuzz-target bodies, consumed by BOTH the bolero crate (fuzz/) and the
# afl.rs crate (fuzz-afl/). Its own workspace root (empty [workspace]) so it does
# NOT join the parent workspace — the fuzzing dependency tree never enters the
# main workspace's audit/deny/hakari/dev surface. Depends only on mnesis-store —
# NO fuzzing-engine deps — so it is safe to sit in the stable `mnesis-fuzz-replay`
# dependency graph.
[workspace]

[package]
name = "fuzz-common"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
# `cbor` turns on the backup-box decoders (decode_header / decode_chunk); wire
# and value are always available. Host-only build, so the std-implying cbor deps
# are fine here.
mnesis-store = { path = "../crates/store", features = ["cbor"] }
