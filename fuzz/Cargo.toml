# Isolated fuzzing workspace. The empty [workspace] table makes this crate its
# OWN workspace root so the parent workspace stays clean (CLAUDE.md) and the
# fuzzing dependency tree never enters the main workspace's audit/deny/hakari/dev
# surface. Exercised by the stable `mnesis-fuzz-replay` nix check (corpus replay
# + bounded random, no nightly) and the scheduled `deep-fuzz` CI workflow.
[workspace]

[package]
name = "mnesis-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
bolero = "0.13.4"
fuzz-common = { path = "../fuzz-common" }

# bolero requires a `fuzz` profile to exist.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
